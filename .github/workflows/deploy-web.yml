# Deploy Web (Vercel)

# Auto-deploy frontend `web/` ke Vercel tiap push ke main (setelah CI lolos)
# atau manual, lewat Vercel CLI.
#
# Kenapa pakai CLI (bukan Git Integration saja):
#   - Konsisten: deploy di-trigger oleh workflow yang sama dengan backend, dan
#     bisa di-trigger manual dari Actions.
#   - Memaksa `VITE_API_BASE_URL` benar saat build (lihat env di bawah).
#   Kalau kamu lebih suka Git Integration, cukup aktifkan di dashboard Vercel
#   (set root directory = `web`) dan blokir/abaikan workflow ini.
#
# Secrets yang WAJIB di-set:
#   VERCEL_TOKEN        - token dari dashboard Vercel (Account -> Tokens)
#   VERCEL_ORG_ID       - dari `vercel whoami` / project settings
#   VERCEL_PROJECT_ID   - dari `.vercel/project.json` setelah `vercel link`
#   VITE_API_BASE_URL   - base URL API waktu build, mis.
#                         https://backend.crunchy.my.id  (PASTIKAN bukan /)
#
# Cara dapat ORG_ID / PROJECT_ID (sekali saja):
#   cd web && npx vercel link
#   cat web/.vercel/project.json  -> ambil orgId & projectId

name: Deploy Web (Vercel)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_run: deploy hanya bila CI SUCCESS. workflow_dispatch: bebas.
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy ke Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Custom domain yang harus selalu menunjuk ke deployment TERBARU.
          # Ganti di sini kalau domain web berubah (jangan lupa juga di Vercel dashboard).
          VERCEL_WEB_DOMAIN: sso.crunchy.my.id
        # Jalankan dari REPO ROOT (bukan web/). Project Vercel `sso` sudah
        # memiliki Root Directory = "web"; dari web/ + rootDirectory project
        # menghasilkan path ganda "web/web" yang tidak ada.
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" \
            || { echo "secret VERCEL_TOKEN kosong"; exit 1; }
          test -n "$VERCEL_ORG_ID" \
            || { echo "secret VERCEL_ORG_ID kosong"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" \
            || { echo "secret VERCEL_PROJECT_ID kosong"; exit 1; }
          test -n "$VITE_API_BASE_URL" \
            || { echo "secret VITE_API_BASE_URL kosong"; exit 1; }

          # Vite membaca VITE_API_BASE_URL dari env shell saat build.
          # JANGAN pakai --cwd web di sini: project Vercel `sso` sudah punya
          # Root Directory = "web", yang diterapkan CLI di atas cwd → "web/web".
          # Jalankan dari repo root (cwd default) dan biarkan rootDirectory
          # project memilih web/ sendiri (terverifikasi: build → web/.vercel/output,
          # deploy → "ready").
          VITE_API_BASE_URL="$VITE_API_BASE_URL" \
            npx vercel build --prod \
              --project "$VERCEL_PROJECT_ID" \
              --token "$VERCEL_TOKEN" \
              --yes

          # Tangkap URL deployment yang baru saja dibuat (baris Production).
          DEPLOY_URL=$(npx vercel deploy --prebuilt --prod \
            --project "$VERCEL_PROJECT_ID" \
            --token "$VERCEL_TOKEN" \
            --yes | grep -oE 'https://[^ ]+\.vercel\.app' | tail -1)
          echo "Deployment URL: $DEPLOY_URL"
          test -n "$DEPLOY_URL" \
            || { echo "gagal menangkap URL deployment"; exit 1; }

          # ARAHKAN custom domain ke deployment TERBARU.
          # (Tanpa langkah ini, domain tetap tertaut (pinned) ke deployment lama
          # padahal deploy baru sudah ada — lihat docs/CHECKPOINT.md.)
          npx vercel alias set "$DEPLOY_URL" "$VERCEL_WEB_DOMAIN" \
            --project "$VERCEL_PROJECT_ID" \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --yes

          # Juga promosikan sbg production utk semua alias project (jaga).
          npx vercel promote "$DEPLOY_URL" \
            --project "$VERCEL_PROJECT_ID" \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --yes
