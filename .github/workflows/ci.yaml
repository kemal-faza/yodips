name: CI

on:
  push:
    branches:
      - main
    # Perubahan dokumen/non-fungsional tdk perlu menjalankan CI (dan otomatis
    # memicu-skip deploy backend/web yg bergantung pada hasil CI). Untuk
    # perubahan KODE kecil yg tak butuh dipush/test, gunakan "[skip ci]" di
    # pesan commit.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "**/.gitignore"
      - "**/README.md"
  pull_request:

permissions:
  contents: read

jobs:
  security-scan:
    name: gitleaks + npm audit
    runs-on: ubuntu-latest
    # 20 menit (sebelumnya 10): npm audit (web) dengan npm@12 Bulk Advisory
    # endpoint intermittently 503/timeout; default fetch timeout 300s membuat
    # attempt pertama ~5 menit dan retry berikutnya terbunuh job timeout.
    # Budget ini menampung 3x attempt (bounded fetch flags, lihat bawah).
    timeout-minutes: 20
    steps:
      # gitleaks-action butuh full history (diff dari base commit). Default
      # checkout adalah shallow (fetch-depth: 1) yang membuat git log pada
      # base ^..head gagal "unknown revision" di repo baru/renamed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22

      # npm >= 11 audits via the Bulk Advisory endpoint; npm 10 (bundled with
      # Node 22) hits the legacy /-/npm/v1/security/audits/quick endpoint,
      # which is in a scheduled brownout (fully retired 2026-07-15) and
      # intermittently 503/400s — setup-node has no npm-version input, so
      # upgrade npm explicitly. The npm advisory service has also been
      # flaky (503/timeouts), so each audit retries a few times.
      #
      # Fetch flags dibatasi (bounded) supaya satu attempt npm audit TIDAK
      # menggantung ~5 menit (default --fetch-timeout=300000):
      #   --fetch-timeout=60000           1 request ≤ 60s
      #   --fetch-retries/mintimeout/maxtimeout backoff 10..60s — retry npm
      #     HANYA utk request idempotent GET (packument dll); lihat catatan.
      # Verifikasi source npm@12 (2026-09-04): make-fetch-happen/remote.js
      # hard-gate retry utk method POST (isRetriable memerlukan non-POST;
      # catch melempar langsung saat method === 'POST'), dan bulk advisory
      # memang dikirim sebagai POST → --fetch-retries TIDAK menambah durasi
      # audit; mekanisme retry yg sebenarnya adalah loop shell `for i in 1 2 3`
      # di bawah (3x attempt, masing-masing ≤ 60s timeout, sleep 10s antar
      # attempt). Worst-case jujur 3 step audit sequential:
      #   3 x (3 x 60s + 2 x 10s) = 600s = 10m, masih < budget job 20m
      #   (sisa ~10m utk npm install -g npm & step lain).
      # Regression test: tools/ci-audit-policy.test.ts — meng-parse jumlah
      # attempt & sleep DARI tiap step di file ini (bukan hardcode), lalu
      # menghitung budget per-step (< 20m) dan total worst-case ketiga step
      # (<= 20m - 60s reserve) dari nilai parse tsb; gagal kalau melanggar.
      # Test fail-loud hanya menjaga struktur (parseable, && exit 0,
      # terminal exit 1) — tidak ada literal jumlah attempt/sleep di test.
      # CATATAN MASA DEPAN: verifikasi di atas berlaku utk npm@12 SEKARANG.
      # Kalau versi npm kelak me-retry request POST (bulk audit) secara
      # internal, batas atas tiap attempt = 60s + 5 backoff 10..60s ≈ 250s →
      # 3 step x 3 attempt x 250s ≈ 38m > budget 20m; saat itu job budget
      # DAN guard test harus dihitung ulang (lihat tools/ci-audit-policy.test.ts).
      - name: upgrade npm for bulk-advisory audit
        run: npm install -g npm@12.0.2

      - name: npm audit (backend)
        working-directory: backend
        run: |
          for i in 1 2 3; do
            npm audit --omit=dev --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000 && exit 0
            echo "npm audit attempt $i failed (registry flake?), retrying..." >&2
            sleep 10
          done
          exit 1

      - name: npm audit (web)
        working-directory: web
        run: |
          for i in 1 2 3; do
            npm audit --omit=dev --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000 && exit 0
            echo "npm audit attempt $i failed (registry flake?), retrying..." >&2
            sleep 10
          done
          exit 1

      - name: npm audit (extension)
        working-directory: extension
        run: |
          for i in 1 2 3; do
            npm audit --omit=dev --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000 && exit 0
            echo "npm audit attempt $i failed (registry flake?), retrying..." >&2
            sleep 10
          done
          exit 1

      - name: advisory — generated Kotlin wasm lock ws version (non-blocking)
        # YD-CI-001 dependency hygiene: the Kotlin Gradle plugin's Yarn wrapper
        # generates mobile/kotlin-js-store/wasm/yarn.lock (+ mobile/build/wasm/
        # yarn.lock) pinning ws@8.18.0/8.20.1 (HIGH memory-exhaustion advisory,
        # fixed >= 8.21.0). The lock is autogenerated — NEVER hand-edit; it is
        # refreshed only by a Kotlin toolchain bump + ./gradlew wasm task. This
        # step is ADVISORY: it warns and exits 0 until the toolchain regenerates
        # ws >= 8.21.0, at which point it prints OK automatically. A MISSING
        # expected lock file is also surfaced as an explicit WARN (a generated
        # lock that has not been produced/committed is not silently ignored).
        run: |
          set +e
          found=0
          for lock in mobile/kotlin-js-store/wasm/yarn.lock mobile/build/wasm/yarn.lock; do
            if [ ! -f "$lock" ]; then
              echo "WARN(advisory): $lock MISSING — expected generated Kotlin wasm yarn.lock (produced by ./gradlew wasm task); non-blocking"
              found=1
              continue
            fi
            ver=$(grep -oE 'ws@8\.[0-9]+\.[0-9]+' "$lock" | sort -u | tr '\n' ' ')
            case "$ver" in
              *8.21*|*8.2[2-9]*|*8.[3-9]*|*9.*) echo "OK: $lock ws $ver" ;;
              *) echo "WARN(advisory): $lock ws $ver — upgrade to >= 8.21.0 when the Kotlin toolchain permits (docs/CHECKPOINT); non-blocking" ; found=1 ;;
            esac
          done
          exit 0

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dir: backend
          - name: web
            dir: web
          - name: extension
            dir: extension
          - name: tools
            dir: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: install
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: test
        working-directory: ${{ matrix.dir }}
        run: npm test

  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - test
      - security-scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dir: backend
            cmd: npm run build && test -e dist/main.js
          - name: web
            dir: web
            cmd: npm run build && test -e dist/index.html
          - name: extension
            dir: extension
            cmd: npm run build && test -d dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: install
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: build
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmd }}
