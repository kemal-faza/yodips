name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  security-scan:
    name: gitleaks + npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm audit (backend)
        working-directory: backend
        run: npm audit --omit=dev

      - name: npm audit (web)
        working-directory: web
        run: npm audit --omit=dev

      - name: npm audit (extension)
        working-directory: extension
        run: npm audit --omit=dev

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dir: backend
          - name: web
            dir: web
          - name: extension
            dir: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: install
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: test
        working-directory: ${{ matrix.dir }}
        run: npm test

  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - test
      - security-scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dir: backend
            cmd: npm run build && test -e dist/main.js
          - name: web
            dir: web
            cmd: npm run build && test -e dist/index.html
          - name: extension
            dir: extension
            cmd: npm run build && test -d dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: install
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: build
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmd }}
