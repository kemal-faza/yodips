name: Bug report
description: Something isn't working the way it should
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A report that includes your version and clear reproduction steps is the most useful kind.

        **Do not report security vulnerabilities here.** Use [private vulnerability reporting](https://github.com/kemal-faza/yodips/security/advisories/new) instead — see [SECURITY.md](https://github.com/kemal-faza/yodips/blob/main/SECURITY.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability
          required: true
        - label: I have not pasted my password, session cookies, or JWT anywhere below
          required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where does this happen?
      options:
        - Web app
        - Browser extension
        - Android app
        - Backend API
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: App version, extension version, or the commit SHA you built from.
      placeholder: "e.g. Android 0.6.6, extension 0.3.6, or commit 4b9b0f4"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behaviour, including any error message you saw.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Be as specific as you can. Note anything you had to do first, such as signing in again.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Optional. Redact your NIM, your name, cookies, and tokens before pasting anything.
      render: shell
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. Chrome 140 on Windows 11 / Pixel 7 on Android 14 / Node 22"
    validations:
      required: false
