name: Feature request
description: Suggest an idea or an improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describing the underlying problem first, rather than only the solution, makes it much easier to find the right approach.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
        - label: I have read the scope notes in the README and this fits the project
          required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which part would this affect?
      options:
        - Web app
        - Browser extension
        - Android app
        - Backend API
        - All of them
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you running into?
      description: What are you trying to do, and where does the app get in your way today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Optional. Workarounds you use now, and why they are not good enough.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Mockups, screenshots, links to similar features in other apps.
    validations:
      required: false
