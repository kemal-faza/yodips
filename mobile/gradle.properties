# Must be enabled to use AndroidX/Compose dependencies.
android.useAndroidX=true
# Keep build-time VM within reasonable bounds.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
# Jetifier is not needed: every dependency is already AndroidX.
# Resource shrinking is controlled by isShrinkResources in app/build.gradle.kts.
android.enableJetifier=false
