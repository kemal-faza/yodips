<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#01637E">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">
    <link rel="manifest" href="manifest.webmanifest">
    <title>YoDips</title>
    <!-- FOUC guard: apply saved/system theme before first paint while the
         bundle downloads. No inline script — /app/ CSP stays inline-free. -->
    <script src="loader.js"></script>
    <style>
        /* FOUC-guard theming: loader.js adds html.theme-dark pre-paint, so the
           first paint is already dark when the user prefers dark. */
        html.theme-dark {
            background: #121212;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }
        html.theme-dark body {
            background: #121212;
        }
        /* ComposeViewport mengambil alih canvas ini; ukuran wajib penuh viewport */
        #ComposeTarget {
            width: 100%;
            height: 100%;
            outline: none;
            display: block;
            touch-action: none;
            position: relative;
        }
        #loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            font-family: system-ui, sans-serif;
            color: #01637E;
            background: #ffffff;
        }
        html.theme-dark #loader {
            color: #7fd4e6;
            background: #121212;
        }
        html.theme-dark .spinner {
            border-color: #264e5c;
            border-top-color: #7fd4e6;
        }
        #loader.hidden { display: none; }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #d4e6ec;
            border-top-color: #01637E;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<canvas id="ComposeTarget"></canvas>
<div id="loader">
    <div class="spinner"></div>
    <div>Memuat YoDips…</div>
</div>
<script src="composeApp.js"></script>
</body>
</html>
